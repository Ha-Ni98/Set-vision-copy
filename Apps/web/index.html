<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Setvision Activation Portal</title>
    <meta
      name="description"
      content="Setvision — Marketing And Digital Services. Activate your Snapchat+ subscription instantly."
    />
    <meta property="og:title" content="Setvision Activation Portal" />
    <meta property="og:description" content="Activate your Snapchat+ subscription with Setvision." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Set the theme class before React mounts — this is a pure client SPA with no
      // server render, so next-themes alone can't prevent a flash of the wrong theme.
      // No system-preference fallback: defaultTheme is "light", matching the ported app.
      (function () {
        if (localStorage.getItem("sv_theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
